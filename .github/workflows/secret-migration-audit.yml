name: Secret migration audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit secret metadata
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_SOURCE_COOKIE_FILE_LAOWANG: ${{ secrets.YOUTUBE_SOURCE_COOKIE_FILE_LAOWANG }}
        run: |
          set -euo pipefail

          audit() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "$name present=false"
              return
            fi

            local bytes digest valid
            bytes="$(printf '%s' "$value" | wc -c | tr -d ' ')"
            digest="$(printf '%s' "$value" | sha256sum | cut -c1-16)"
            valid=false
            if [[ "$value" == *$'\t'* ]]; then
              valid=true
            fi
            echo "$name present=true bytes=$bytes sha256_16=$digest format=netscape valid=$valid"
          }

          audit YOUTUBE_COOKIES "${YOUTUBE_COOKIES:-}"
          audit YOUTUBE_SOURCE_COOKIE_FILE_LAOWANG "${YOUTUBE_SOURCE_COOKIE_FILE_LAOWANG:-}"
