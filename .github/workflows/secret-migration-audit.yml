name: Secret migration audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit secret metadata
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail

          value="${YOUTUBE_COOKIES:-}"
          if [[ -z "$value" ]]; then
            echo "YOUTUBE_COOKIES present=false"
            exit 0
          fi

          bytes="$(printf '%s' "$value" | wc -c | tr -d ' ')"
          digest="$(printf '%s' "$value" | sha256sum | cut -c1-16)"
          valid=false
          if [[ "$value" == *$'\t'* ]]; then
            valid=true
          fi
          echo "YOUTUBE_COOKIES present=true bytes=$bytes sha256_16=$digest format=netscape valid=$valid"
